<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automatic Routing Failover & AI Monitoring Dashboard</title>
    <!--
      v2 changes:
      - R2 and R4 link buttons now drive the active path (PRIMARY / BACKUP / OUTAGE).
      - Recovery applies a 20 s hold-down (IP SLA track delay-up); routers stay on R4 until it expires.
      - T6 (R4 backup failure) added.
      - Test matrix shows a simulator model check, not lab evidence. KPIs are values you measure and enter.
      - Icons are inline SVG, so they render on every tab (no lucide dependency).
      - Telemetry interval unified to 15 s. Manual link changes switch the scenario highlight to "Manual mode".
    -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            950: '#020617',
                            900: '#0f172a',
                            800: '#1e293b',
                            700: '#334155',
                            600: '#475569'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen selection:bg-cyan-500 selection:text-slate-950">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        /* ---------------- Constants ---------------- */

        const HOLD_DOWN_SECONDS = 20;

        const LINK_NAMES = { r1_r2: 'R1-R2', r2_r3: 'R2-R3', r1_r4: 'R1-R4', r4_r3: 'R4-R3' };

        const SCENARIOS = {
            T1: {
                name: 'T1: Normal Operation',
                links: { r1_r2: true, r2_r3: true, r1_r4: true, r4_r3: true },
                level: 'INFO',
                msg: 'Scenario T1 (Normal Operation): All primary and backup links active.',
                reset: true
            },
            T2: {
                name: 'T2: R1-R2 Failure',
                links: { r1_r2: false, r2_r3: true, r1_r4: true, r4_r3: true },
                level: 'WARNING',
                msg: 'Scenario T2 (R1-R2 Link Failure): Direct link down. R1 and R3 IP SLA probes fail, both routers switch to R4 backup.'
            },
            T3: {
                name: 'T3: R2-R3 Failure (Key)',
                links: { r1_r2: true, r2_r3: false, r1_r4: true, r4_r3: true },
                level: 'CRITICAL',
                msg: 'Scenario T3 (R2-R3 Link Failure): One hop away failure. R1-R3 probe times out, backup path engaged.'
            },
            T4: {
                name: 'T4: Dual Primary',
                links: { r1_r2: false, r2_r3: false, r1_r4: true, r4_r3: true },
                level: 'CRITICAL',
                msg: 'Scenario T4 (Dual Primary Failure): Both primary transit links severed. Full failover to R4 path.'
            },
            T5: {
                name: 'T5: Recovery',
                links: { r1_r2: true, r2_r3: true, r1_r4: true, r4_r3: true },
                level: 'INFO',
                msg: 'Scenario T5 (Recovery): Primary links restored. Hold-down started, routers stay on R4 until it expires.'
            },
            T6: {
                name: 'T6: R4 Failure',
                links: { r1_r2: true, r2_r3: true, r1_r4: false, r4_r3: false },
                level: 'WARNING',
                msg: 'Scenario T6 (R4 Backup Failure): Backup transit disabled. Primary path should be unaffected.'
            }
        };

        const SCENARIO_IDS = ['T1', 'T2', 'T3', 'T4', 'T5', 'T6'];

        // expected = the active path the simulator must settle on for that scenario
        const TESTS = [
            { id: 'T1', scenario: 'Normal Operation', action: 'All links UP', expected: 'PRIMARY', expectedText: 'Both directions via R2 primary' },
            { id: 'T2', scenario: 'R1-R2 Link Failure', action: 'Shutdown R1 Gig0/1 (R1-R2 link)', expected: 'BACKUP', expectedText: 'Both directions via R4 backup within < 15 s' },
            { id: 'T3', scenario: 'R2-R3 Link Failure (Key)', action: 'Shutdown R2-R3 link', expected: 'BACKUP', expectedText: 'Both directions via R4 (IP SLA detects via R1-R3 probe)' },
            { id: 'T4', scenario: 'Dual Primary Failure', action: 'Shutdown both R1-R2 & R2-R3', expected: 'BACKUP', expectedText: 'Seamless failover to R4 backup path' },
            { id: 'T5', scenario: 'Recovery', action: 'No shutdown on failed link', expected: 'PRIMARY', expectedText: 'Return to R2 after the 20 s hold-down, without flapping' },
            { id: 'T6', scenario: 'R4 Backup Failure', action: 'Disable R4 transit', expected: 'PRIMARY', expectedText: 'Primary path unaffected' }
        ];

        const KPIS = [
            { key: 'detect', label: 'Detection Time', target: '< 15 s', limit: 15, lower: true, unit: 's' },
            { key: 'failover', label: 'Total Failover Time', target: '< 20 s, zero loss after switch', limit: 20, lower: true, unit: 's' },
            { key: 'falseFo', label: 'False Failovers (per 24 h)', target: '0', limit: 0, lower: true, unit: '' },
            { key: 'aiAcc', label: 'AI Diagnosis Accuracy', target: 'No target set', limit: null, lower: false, unit: '%' }
        ];

        const PATH_STYLE = {
            PRIMARY: { box: 'bg-emerald-950/40 border-emerald-500/50 text-emerald-300', text: 'Active path: PC0 → SW0 → R1 → R2 → R3 → SW1 → PC1 (primary)' },
            BACKUP: { box: 'bg-amber-950/30 border-amber-500/50 text-amber-300', text: 'Active path: PC0 → SW0 → R1 → R4 → R3 → SW1 → PC1 (backup)' },
            OUTAGE: { box: 'bg-red-950/40 border-red-500/60 text-red-300', text: 'No end-to-end path: PC0 cannot reach PC1' }
        };

        const CLI_TABS = [
            { id: 'ip_sla', label: 'show ip sla statistics' },
            { id: 'track', label: 'show track' },
            { id: 'route', label: 'show ip route' },
            { id: 'traceroute', label: 'traceroute 192.168.20.1' }
        ];

        const CLI_COMMANDS = {
            ip_sla: 'show ip sla statistics',
            track: 'show track',
            route: 'show ip route 192.168.20.0',
            traceroute: 'traceroute 192.168.20.1'
        };

        /* ---------------- Pure helpers ---------------- */

        // Active path from link states: primary needs R1-R2 and R2-R3; backup needs R1-R4 and R4-R3.
        function pathOf(l) {
            if (l.r1_r2 && l.r2_r3) return 'PRIMARY';
            if (l.r1_r4 && l.r4_r3) return 'BACKUP';
            return 'OUTAGE';
        }

        function getRca(path, inHold, holdLeft) {
            if (path === 'PRIMARY' && !inHold) {
                return { head: 'Normal Operation', cls: 'text-emerald-400', body: 'All primary links operational. Forward and return paths are symmetric.' };
            }
            if (inHold) {
                return { head: 'Recovery (Hold-down)', cls: 'text-amber-400', body: `Primary links are back. Routers wait ${holdLeft}s before moving back to R2, so a short flap does not cause a switch.` };
            }
            if (path === 'BACKUP') {
                return { head: 'Link Failure Detected', cls: 'text-red-400', body: 'Primary transit broken. Layer 1 failover moved both routers onto the R4 floating static route (AD 10).' };
            }
            return { head: 'Total Outage', cls: 'text-red-500', body: 'No primary or backup path available. Escalate to the on-call engineer.' };
        }

        function kpiStatus(k, v) {
            if (v === '' || v === undefined) return { text: 'Not measured', cls: 'text-slate-500' };
            const n = parseFloat(v);
            if (Number.isNaN(n)) return { text: 'Invalid value', cls: 'text-red-400' };
            if (k.limit === null) return { text: 'Recorded', cls: 'text-cyan-400' };
            const ok = k.lower ? n <= k.limit : n >= k.limit;
            return ok
                ? { text: 'Meets target', cls: 'text-emerald-400' }
                : { text: 'Misses target', cls: 'text-red-400' };
        }

        /* ---------------- Inline SVG icons (no external icon library) ---------------- */

        const ICONS = {
            network: (<><rect x="16" y="16" width="6" height="6" rx="1" /><rect x="2" y="16" width="6" height="6" rx="1" /><rect x="9" y="2" width="6" height="6" rx="1" /><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3" /><path d="M12 12V8" /></>),
            'git-commit': (<><circle cx="12" cy="12" r="3" /><line x1="3" y1="12" x2="9" y2="12" /><line x1="15" y1="12" x2="21" y2="12" /></>),
            terminal: (<><polyline points="4 17 10 11 4 5" /><line x1="12" y1="19" x2="20" y2="19" /></>),
            cpu: (<><rect x="4" y="4" width="16" height="16" rx="2" /><rect x="9" y="9" width="6" height="6" /><path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 15h3M1 9h3M1 15h3" /></>),
            'bar-chart-2': (<><line x1="18" y1="20" x2="18" y2="10" /><line x1="12" y1="20" x2="12" y2="4" /><line x1="6" y1="20" x2="6" y2="14" /></>),
            'check-circle': (<><circle cx="12" cy="12" r="10" /><polyline points="8 12 11 15 16 9" /></>),
            'share-2': (<><circle cx="18" cy="5" r="3" /><circle cx="6" cy="12" r="3" /><circle cx="18" cy="19" r="3" /><line x1="8.6" y1="13.5" x2="15.4" y2="17.5" /><line x1="15.4" y1="6.5" x2="8.6" y2="10.5" /></>),
            monitor: (<><rect x="2" y="3" width="20" height="14" rx="2" /><line x1="8" y1="21" x2="16" y2="21" /><line x1="12" y1="17" x2="12" y2="21" /></>),
            router: (<><rect x="2" y="14" width="20" height="6" rx="2" /><path d="M7 14L5 7M17 14l2-7" /><circle cx="6" cy="17" r="1" /><circle cx="10" cy="17" r="1" /></>),
            server: (<><rect x="2" y="2" width="20" height="8" rx="2" /><rect x="2" y="14" width="20" height="8" rx="2" /><line x1="6" y1="6" x2="6.01" y2="6" /><line x1="6" y1="18" x2="6.01" y2="18" /></>),
            'shield-check': (<><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" /><polyline points="9 12 11 14 15 10" /></>),
            'shield-alert': (<><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" /><line x1="12" y1="8" x2="12" y2="13" /><line x1="12" y1="16" x2="12.01" y2="16" /></>),
            lock: (<><rect x="3" y="11" width="18" height="11" rx="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></>),
            clock: (<><circle cx="12" cy="12" r="10" /><polyline points="12 6 12 12 16 14" /></>)
        };

        function Icon({ name, className = 'w-5 h-5' }) {
            return (
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    strokeWidth="2"
                    strokeLinecap="round"
                    strokeLinejoin="round"
                    className={className}
                    aria-hidden="true"
                >
                    {ICONS[name]}
                </svg>
            );
        }

        /* ---------------- Small presentational components ---------------- */

        function Node({ icon, title, sub, detail, variant = 'device', accent = false }) {
            if (variant === 'switch') {
                return (
                    <div className="flex flex-col items-center justify-center p-2 bg-slate-900/60 border border-slate-800 rounded-lg text-center">
                        <span className="text-[10px] font-bold text-slate-300">{title}</span>
                    </div>
                );
            }
            return (
                <div className={`flex flex-col items-center justify-center p-3 bg-slate-900 rounded-xl text-center ${
                    accent ? 'border-2 border-cyan-500/60 shadow-lg shadow-cyan-500/10' : 'border border-slate-700/80 shadow-md'
                }`}>
                    {icon && <Icon name={icon} className="w-8 h-8 text-cyan-400 mb-1" />}
                    <span className="text-xs font-bold text-white">{title}</span>
                    {sub && <span className="text-[10px] text-cyan-300 font-mono">{sub}</span>}
                    {detail && <span className="text-[9px] text-slate-400 mt-1">{detail}</span>}
                </div>
            );
        }

        function TransitCard({ title, tone, ring, children }) {
            const tones = {
                emerald: 'bg-emerald-950/30 border-emerald-500/50 text-emerald-300',
                amber: 'bg-amber-950/20 border-amber-500/50 text-amber-300'
            };
            return (
                <div className={`p-3 rounded-xl border text-center space-y-2 transition-all ${tones[tone]} ${
                    ring ? 'ring-2 ring-cyan-400/60 shadow-lg' : ''
                }`}>
                    <div className="flex items-center justify-center gap-1 text-xs font-bold">
                        <Icon name="server" className="w-4 h-4" /> {title}
                    </div>
                    {children}
                </div>
            );
        }

        function LinkChip({ label, up, onClick }) {
            return (
                <button
                    onClick={onClick}
                    className={`w-full px-2 py-1 rounded-lg text-[10px] font-mono font-bold border transition-all ${
                        up
                            ? 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40 hover:bg-emerald-500/30'
                            : 'bg-red-500/20 text-red-300 border-red-500/40 hover:bg-red-500/30 animate-pulse'
                    }`}
                >
                    {label}: {up ? 'UP' : 'DOWN'}
                </button>
            );
        }

        function TestBadge({ result }) {
            if (result === 'PASS') {
                return <span className="px-2.5 py-1 rounded-full text-[10px] font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/40">PASS (model check)</span>;
            }
            if (result === 'FAIL') {
                return <span className="px-2.5 py-1 rounded-full text-[10px] font-bold bg-red-500/20 text-red-400 border border-red-500/40">FAIL</span>;
            }
            if (result === 'RUNNING') {
                return <span className="px-2.5 py-1 rounded-full text-[10px] font-bold bg-amber-500/20 text-amber-300 border border-amber-500/40">Running…</span>;
            }
            return <span className="px-2.5 py-1 rounded-full text-[10px] font-bold bg-slate-800 text-slate-400 border border-slate-700">Not run</span>;
        }

        /* ---------------- Main app ---------------- */

        function App() {
            // Simulation state
            const [scenario, setScenario] = useState('T1');           // T1..T6, or 'CUSTOM' after a manual toggle
            const [linkStates, setLinkStates] = useState(SCENARIOS.T1.links);
            const [holdLeft, setHoldLeft] = useState(0);              // seconds left in hold-down (0 = none)
            const [holdFrom, setHoldFrom] = useState('BACKUP');       // path the routers stay on during hold-down
            const [activeTab, setActiveTab] = useState('topology');
            const [cliDevice, setCliDevice] = useState('R1');
            const [cliCommandTab, setCliCommandTab] = useState('ip_sla');

            // Test and KPI state
            const [testResults, setTestResults] = useState({});       // { T1: 'PASS' | 'FAIL' | 'RUNNING' }
            const [measured, setMeasured] = useState({ detect: '', failover: '', falseFo: '', aiAcc: '' });

            // AI and approval state
            const [approvalQueue, setApprovalQueue] = useState([
                { id: 1, title: 'Verify Floating Static Route Activation on R3', type: 'Level 2 Action', risk: 'Medium', details: 'R2-R3 link severed. Propose validating backup route via R4 (AD 10).', status: 'Pending' },
                { id: 2, title: 'Adjust IP SLA Hold-Down Timer (Delay Up 20s)', type: 'Level 2 Action', risk: 'Low', details: 'Prevent route flapping during intermittent micro-outages.', status: 'Pending' }
            ]);
            const [incidentLogs, setIncidentLogs] = useState([
                { time: '13:30:05', level: 'INFO', msg: 'System initialized. Layer 1 IOS tracking active on R1 (Track 10) & R3 (Track 20).' },
                { time: '13:30:12', level: 'SUCCESS', msg: 'IP SLA ICMP probes stable. RTT: 4ms across R2 transit.' }
            ]);

            // Derived state
            const basePath = pathOf(linkStates);                       // path implied by link states alone
            const inHold = basePath === 'PRIMARY' && holdLeft > 0;     // primary is back but routers wait
            const path = inHold ? holdFrom : basePath;                 // path the routers actually use
            const probeUp = basePath === 'PRIMARY';                    // IP SLA probes are pinned via R2
            const trackUp = probeUp && !inHold;                        // track goes UP only after delay-up
            const backupUp = linkStates.r1_r4 && linkStates.r4_r3;

            const addLog = (level, msg) => {
                const time = new Date().toLocaleTimeString();
                setIncidentLogs(prev => [{ time, level, msg }, ...prev.slice(0, 49)]);
            };

            // Single place where link changes are applied; starts or cancels hold-down.
            const applyLinks = (newLinks, opts = {}) => {
                const prev = basePath;
                const next = pathOf(newLinks);
                setLinkStates(newLinks);
                if (next !== 'PRIMARY' || opts.skipHold) {
                    setHoldLeft(0);
                    return;
                }
                if (prev !== 'PRIMARY') {
                    setHoldFrom(prev);
                    setHoldLeft(HOLD_DOWN_SECONDS);
                    addLog('WARNING', `Primary restored. Hold-down started (${HOLD_DOWN_SECONDS}s): routers stay on ${prev} until the timer expires.`);
                }
            };

            const applyScenario = (id) => {
                const s = SCENARIOS[id];
                setScenario(id);
                setTestResults(r => ({ ...r, [id]: 'RUNNING' }));
                applyLinks(s.links, { skipHold: !!s.reset });
                addLog(s.level, s.msg);
            };

            const toggleLink = (key) => {
                const newState = !linkStates[key];
                setScenario('CUSTOM');
                applyLinks({ ...linkStates, [key]: newState });
                addLog('INFO', `Manual toggle: ${LINK_NAMES[key]} set to ${newState ? 'UP' : 'DOWN'}`);
            };

            const handleApproval = (id, decision) => {
                setApprovalQueue(prev => prev.map(item => item.id === id ? { ...item, status: decision } : item));
                addLog(decision === 'Approved' ? 'SUCCESS' : 'WARNING', `Human approval gate: Item #${id} was ${decision}. (Logged only, simulation does not change routers.)`);
            };

            // Hold-down countdown. Cleanup cancels the timer if links change mid-hold.
            useEffect(() => {
                if (holdLeft <= 0) return;
                const t = setTimeout(() => {
                    if (holdLeft === 1) {
                        addLog('SUCCESS', 'Hold-down expired. Routers switched back to primary path via R2 without flapping.');
                    }
                    setHoldLeft(h => h - 1);
                }, 1000);
                return () => clearTimeout(t);
            }, [holdLeft]);

            // Model check: once the simulator settles, compare its path with the scenario's expected path.
            useEffect(() => {
                const test = TESTS.find(t => t.id === scenario);
                if (!test || holdLeft > 0) return;
                const val = path === test.expected ? 'PASS' : 'FAIL';
                setTestResults(r => (r[scenario] === val ? r : { ...r, [scenario]: val }));
            }, [scenario, path, holdLeft]);

            // Header pill
            const pill = inHold
                ? { dot: 'bg-amber-500 animate-pulse', text: 'text-amber-400', label: `HOLD-DOWN · ${holdLeft}s (still on R4)` }
                : path === 'PRIMARY'
                    ? { dot: 'bg-emerald-500 animate-pulse', text: 'text-emerald-400', label: 'PRIMARY ACTIVE' }
                    : path === 'BACKUP'
                        ? { dot: 'bg-red-500 animate-ping', text: 'text-red-400', label: 'FAILOVER VIA R4' }
                        : { dot: 'bg-red-600 animate-ping', text: 'text-red-400', label: 'NO PATH' };

            const pc = PATH_STYLE[path];
            const rca = getRca(path, inHold, holdLeft);

            // CLI values for the selected device
            const isR1 = cliDevice === 'R1';
            const entryId = isR1 ? '10' : '20';
            const peerIp = isR1 ? '40.0.0.2 (R3)' : '20.0.0.2 (R1)';
            const primaryNh = isR1 ? '20.0.0.2 (R2)' : '40.0.0.1 (R2)';
            const backupNh = isR1 ? '30.0.0.2 (R4)' : '50.0.0.1 (R4)';

            return (
                <div className="flex flex-col min-h-screen bg-slate-950 text-slate-100">

                    {/* Header */}
                    <header className="bg-slate-900 border-b border-slate-800 sticky top-0 z-50 px-6 py-4 flex flex-col md:flex-row items-center justify-between gap-4">
                        <div className="flex items-center gap-3">
                            <div className="p-2.5 bg-gradient-to-br from-cyan-500 to-blue-600 rounded-xl shadow-lg shadow-cyan-500/20">
                                <Icon name="network" className="w-6 h-6 text-white" />
                            </div>
                            <div>
                                <h1 className="text-lg font-bold bg-gradient-to-r from-white via-slate-200 to-cyan-400 bg-clip-text text-transparent">
                                    Automatic Routing Failover & AI Monitoring Dashboard
                                </h1>
                                <p className="text-xs text-slate-400">WE ATS School Capstone Project | IP SLA + Object Tracking + AI Supervisory Agent</p>
                            </div>
                        </div>

                        <div className="flex items-center gap-3 flex-wrap">
                            <div className="flex items-center gap-2 px-3 py-1.5 bg-slate-800/80 border border-slate-700/60 rounded-lg text-xs font-medium">
                                <span className={`w-2.5 h-2.5 rounded-full ${pill.dot}`}></span>
                                <span className="text-slate-300">Layer 1 IOS:</span>
                                <span className={`font-bold ${pill.text}`}>{pill.label}</span>
                            </div>
                            <div className="flex items-center gap-2 px-3 py-1.5 bg-slate-800/80 border border-slate-700/60 rounded-lg text-xs font-medium">
                                <span className="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-pulse"></span>
                                <span className="text-slate-300">Layer 2 AI Agent:</span>
                                <span className="text-cyan-300 font-bold">ONLINE (Read-Only)</span>
                            </div>
                        </div>
                    </header>

                    {/* Scenario control bar */}
                    <div className="bg-slate-900/60 border-b border-slate-800/80 px-6 py-3 flex items-center justify-between overflow-x-auto gap-4">
                        <div className="flex items-center gap-2 min-w-max">
                            <span className="text-xs font-bold text-slate-400 uppercase tracking-wider mr-2">Test Scenarios:</span>
                            {SCENARIO_IDS.map(id => (
                                <button
                                    key={id}
                                    onClick={() => applyScenario(id)}
                                    className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition-all shadow-sm ${
                                        scenario === id
                                            ? 'bg-cyan-500 text-slate-950 font-bold shadow-cyan-500/25 ring-2 ring-cyan-400/50'
                                            : 'bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700'
                                    }`}
                                >
                                    {SCENARIOS[id].name}
                                </button>
                            ))}
                            {scenario === 'CUSTOM' && (
                                <span className="text-xs font-bold text-amber-300 bg-amber-500/10 border border-amber-500/40 rounded px-2 py-1">Manual mode</span>
                            )}

                                        Enter the values you measured on the lab network (for example, failover time from a stopwatch or ping log). Empty fields stay empty, so the dashboard does not show results that were never measured.
                                    </p>
                                    <div className="grid grid-cols-1 md:grid-cols-4 gap-6">
                                        {KPIS.map(k => {
                                            const st = kpiStatus(k, measured[k.key]);
                                            return (
                                                <div key={k.key} className="bg-slate-950 border border-slate-800 rounded-xl p-5">
                                                    <span className="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1">{k.label}</span>
                                                    <span className="text-[10px] text-slate-500 block mb-3">Target: {k.target}</span>
                                                    <div className="flex items-center gap-2">
                                                        <input
                                                            type="number"
                                                            step="0.1"
                                                            min="0"
                                                            placeholder="measured"
                                                            value={measured[k.key]}
                                                            onChange={e => setMeasured(m => ({ ...m, [k.key]: e.target.value }))}
                                                            className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm font-mono text-slate-100 focus:outline-none focus:border-cyan-500"
                                                        />
                                                        {k.unit && <span className="text-xs text-slate-400">{k.unit}</span>}
                                                    </div>
                                                    <span className={`text-[11px] font-bold block mt-2 ${st.cls}`}>{st.text}</span>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Footer */}
                    <footer className="bg-slate-900 border-t border-slate-800 px-6 py-4 text-center text-xs text-slate-400">
                        WE ATS School Network Department | Students: Moez Ahmed, Anas Mohamed, Nour Ashraf, Yasmin Emad | Supervisor: Basmala Azam
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
